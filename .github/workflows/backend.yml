name: Backend checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cognova_test
          POSTGRES_PASSWORD: ci-only-ephemeral-password
          POSTGRES_DB: cognova_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cognova_test -d cognova_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://cognova_test:ci-only-ephemeral-password@localhost:5432/cognova_test
      DATABASE_URL: postgresql+psycopg://cognova_test:ci-only-ephemeral-password@localhost:5432/cognova_test
      JWT_SECRET: ci-only-placeholder-secret-at-least-32-bytes
      ENVIRONMENT: test
      TEST_DATABASE_ALLOW_DDL: 'yes'
      REQUIRE_POSTGRES_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install -e '.[dev]' pip-audit build
      - name: Read immutable database reference
        id: database
        run: |
          python -c "import json; r=json.load(open('tools/database-ref.json')); print('commit='+r['commit']); print('repository='+r['repository'])" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.database.outputs.repository }}
          ref: ${{ steps.database.outputs.commit }}
          path: .local/database-handoff
          persist-credentials: false
      - run: ruff check app migrations scripts
      - run: ruff format --check app migrations scripts
      - run: mypy app --exclude app/tests
      - run: python -m pytest -q --junitxml=test-results.xml
      - run: python scripts/check_test_results.py test-results.xml
      - run: python -m build
      - run: pip-audit -r requirements.lock
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml
