# Demo blueprint: free Postgres expires; see docs/DEPLOY.md before production use.
services:
  - type: web
    name: cognova-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install --require-hashes -r requirements.lock && pip install --no-deps .
    startCommand: python scripts/start.py
    healthCheckPath: /api/v1/ready
    autoDeployTrigger: 'off'
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cognova-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: COOKIE_SECURE
        value: 'true'
      - key: COOKIE_SAMESITE
        value: lax
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: '15'
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: '30'
      - key: AUTH_RATE_LIMIT
        value: '20'
      - key: AUTH_RATE_WINDOW_SECONDS
        value: '60'
      - key: DATABASE_POOL_SIZE
        value: '3'
      - key: DATABASE_MAX_OVERFLOW
        value: '2'
databases:
  - name: cognova-postgres
    plan: free
    region: oregon
    postgresMajorVersion: '17'
    databaseName: cognova
    user: cognova
    ipAllowList: []
